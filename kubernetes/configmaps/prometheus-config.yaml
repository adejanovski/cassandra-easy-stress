apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
data:
  prometheus.yml: |
    # Prometheus configuration for cassandra-easy-stress monitoring
    global:
      scrape_interval: 5s      # Scrape metrics every 5 seconds for detailed monitoring
      evaluation_interval: 5s  # Evaluate rules every 5 seconds
      external_labels:
        cluster: 'cassandra-stress'
        job_name: 'n1-stress-sni'

    # Scrape configuration for cassandra-easy-stress metrics endpoint
    scrape_configs:
      - job_name: 'cassandra-easy-stress'
        static_configs:
          - targets: ['localhost:9500']
            labels:
              application: 'cassandra-easy-stress'
              workload: 'BasicTimeSeries'
        
        # Scrape timeout should be less than scrape interval
        scrape_timeout: 4s
        
        # Keep all metrics from the stress tool
        metric_relabel_configs:
          - source_labels: [__name__]
            regex: '(selects|mutations|deletions|populateMutations|errors).*'
            action: keep

